server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Necesario para que React Router funcione en rutas directas
        # (p.ej. recargar /tickets/5 no debe devolver 404 de Nginx).
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy hacia el backend: el frontend llama a /api/... con el
    # mismo origen, sin necesidad de CORS en producción.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
